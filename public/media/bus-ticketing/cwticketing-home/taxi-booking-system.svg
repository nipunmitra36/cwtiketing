 <path d="M199 135 L260 174 L327 140 L419 187 L419 310 L352 286 L280 323 L199 283 Z" fill="#EAF4F2"/>
 <path d="M205 166 L264 205 L329 170 L414 211" fill="none" stroke="#73A7A8" stroke-width="6"/>
 <path d="M222 268 L284 210 L365 236 L407 196" fill="none" stroke="#B5C8CE" stroke-width="5"/>
 <path d="M325 143 C325 143 305 177 305 195" stroke="#FF6B35" stroke-width="6" fill="none"/>
 <circle cx="305" cy="202" r="12" fill="#FF6B35"/><circle cx="305" cy="202" r="5" fill="#fff"/>
 <path d="M219 319 H398" stroke="#D8E2E5" stroke-width="2"/>
 <text x="220" y="354" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#29434C">Your ride</text>
 <text x="220" y="380" font-family="Arial,sans-serif" font-size="15" fill="#71858C">Arrives in 4 min</text>
 <rect x="220" y="407" width="178" height="48" rx="24" fill="url(#accent)"/>
 <text x="278" y="437" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">BOOK RIDE</text>
</g>
<!-- person -->
