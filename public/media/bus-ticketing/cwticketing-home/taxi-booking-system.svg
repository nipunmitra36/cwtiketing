 <circle cx="74" cy="28" r="27" fill="#B97862"/><path d="M47 28 C49 -2 92 -9 101 23 C87 17 73 16 60 30Z" fill="#273F48"/>
 <path d="M52 69 C64 56 88 56 101 70 L114 156 L39 156 Z" fill="url(#accent)"/>
