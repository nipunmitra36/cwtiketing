<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Redesigned ride booking illustration</title>
  <desc id="desc">Original vector illustration redesigned from the supplied transport concept.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F9FC"/><stop offset="1" stop-color="#E7F0F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF5B2E"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A7180"/><stop offset="1" stop-color="#174A59"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".14"/>
    </filter>
  </defs>
  
<rect width="600" height="600" rx="36" fill="#F7FAFC"/>
<circle cx="170" cy="175" r="122" fill="#DDF0EE"/><circle cx="465" cy="365" r="150" fill="#E9F0F7"/>
<!-- phone -->
<g filter="url(#shadow)">
 <rect x="184" y="70" width="250" height="448" rx="38" fill="#233D46"/>
 <rect x="199" y="91" width="220" height="406" rx="27" fill="#fff"/>
 <rect x="199" y="91" width="220" height="44" rx="27" fill="#EEF5F6"/>
 <circle cx="309" cy="106" r="5" fill="#233D46"/>
