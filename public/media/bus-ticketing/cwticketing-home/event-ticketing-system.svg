<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">Redesigned event booking illustration</title>
<desc id="desc">An original vector illustration showing a person viewing upcoming events on a mobile device.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FAFC"/>
    <stop offset="1" stop-color="#E7F1F3"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF8A3D"/>
    <stop offset="1" stop-color="#F45D2A"/>
  </linearGradient>
  <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3B5963"/>
    <stop offset="1" stop-color="#294650"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".15"/>
  </filter>
</defs>

<rect width="760" height="560" rx="34" fill="url(#bg)"/>
<circle cx="115" cy="112" r="76" fill="#DDEEEF"/>
<circle cx="675" cy="455" r="92" fill="#E9E2DC"/>

<!-- window / interior -->
<g transform="translate(55 70)">
  <rect x="0" y="0" width="180" height="300" rx="8" fill="#E4EAEC"/>
  <rect x="12" y="14" width="156" height="272" fill="#FAFCFC"/>
  <path d="M12 190 Q65 140 112 188 T168 170 V286 H12Z" fill="#E1E7E8"/>
  <path d="M12 224 Q58 181 102 224 T168 214 V286 H12Z" fill="#D2DBDE"/>
  <path d="M58 14 V145 M101 14 V145 M144 14 V145" stroke="#D7E0E2" stroke-width="4"/>
  <path d="M12 145 H168" stroke="#D7E0E2" stroke-width="4"/>
  <rect x="-8" y="286" width="196" height="10" rx="5" fill="#C7D2D5"/>
</g>

<!-- plant -->
<g transform="translate(35 390)">
  <path d="M38 94 C25 68 26 39 38 12 M43 94 C48 62 65 44 79 31" fill="none" stroke="#7E9D8D" stroke-width="5"/>
  <ellipse cx="30" cy="24" rx="12" ry="30" transform="rotate(-18 30 24)" fill="#AFC8B6"/>
  <ellipse cx="73" cy="34" rx="13" ry="28" transform="rotate(28 73 34)" fill="#C2D5C5"/>
  <ellipse cx="19" cy="65" rx="13" ry="25" transform="rotate(-60 19 65)" fill="#AFC8B6"/>
  <path d="M8 91 H91 L82 130 H17Z" fill="#F1F3F2" stroke="#A9B8BA" stroke-width="3"/>
  <path d="M14 99 H85" stroke="#D2DADB" stroke-width="3"/>
</g>

<!-- person -->
<g transform="translate(145 166)">
  <circle cx="65" cy="28" r="29" fill="#C98269"/>
  <path d="M38 29 C36 2 56 -13 81 0 C96 8 99 25 91 37 C84 18 65 16 46 36Z" fill="#263E47"/>
  <path d="M44 70 C56 55 80 54 94 70 L106 185 H22 L30 93 C31 83 36 76 44 70Z" fill="url(#orange)"/>
  <path d="M46 88 L13 130" stroke="#263E47" stroke-width="12" stroke-linecap="round"/>
  <path d="M93 88 L123 111" stroke="#C98269" stroke-width="12" stroke-linecap="round"/>
  <path d="M122 111 L146 91" stroke="#C98269" stroke-width="8" stroke-linecap="round"/>
  <path d="M42 183 L36 313" stroke="#263E47" stroke-width="16" stroke-linecap="round"/>
  <path d="M88 183 L103 313" stroke="#263E47" stroke-width="16" stroke-linecap="round"/>
  <path d="M25 315 H58 M88 315 H122" stroke="#F06B32" stroke-width="11" stroke-linecap="round"/>
  <path d="M51 76 Q65 104 76 130" fill="none" stroke="#FFB17A" stroke-width="3"/>
</g>

<!-- phone -->
<g filter="url(#shadow)">
  <rect x="335" y="42" width="365" height="478" rx="42" fill="url(#phone)"/>
  <rect x="353" y="78" width="329" height="406" rx="8" fill="#FFFFFF"/>
  <rect x="474" y="57" width="87" height="7" rx="3.5" fill="#1E353D"/>
  <circle cx="517" cy="501" r="17" fill="#203B44"/>

  <!-- header -->
  <text x="426" y="111" font-family="Arial,sans-serif" font-size="15" fill="#6C7E84">‹</text>
  <text x="600" y="111" font-family="Arial,sans-serif" font-size="15" fill="#6C7E84">›</text>
  <text x="517" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#263F48">UPCOMING EVENTS</text>

  <!-- event 1 -->
  <g transform="translate(373 132)">
    <rect width="289" height="92" rx="3" fill="#F8FAFA" stroke="#415A63" stroke-width="2"/>
    <rect x="0" y="0" width="72" height="92" fill="#FFFFFF"/>
    <rect x="28" y="14" width="18" height="19" rx="2" fill="none" stroke="#FF7137" stroke-width="2"/>
    <path d="M32 10 V18 M42 10 V18 M28 22 H46" stroke="#FF7137" stroke-width="2"/>
    <text x="36" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263F48">12</text>
    <path d="M23 75 H49" stroke="#A8B6B9" stroke-width="2"/>
    <text x="91" y="29" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#263F48">CITY MUSIC NIGHT</text>
    <text x="91" y="53" font-family="Arial,sans-serif" font-size="12" fill="#70838A">FRI · 8:00 PM</text>
    <circle cx="247" cy="46" r="30" fill="#DDECEE"/>
    <circle cx="247" cy="46" r="22" fill="#355A63"/>
    <path d="M247 25 L255 40 L273 42 L260 54 L263 72 L247 63 L231 72 L234 54 L221 42 L239 40Z" fill="#FF7540"/>
  </g>

  <!-- event 2 -->
  <g transform="translate(373 238)">
    <rect width="289" height="92" rx="3" fill="#F8FAFA" stroke="#415A63" stroke-width="2"/>
    <rect x="0" y="0" width="72" height="92" fill="#FFFFFF"/>
    <rect x="28" y="14" width="18" height="19" rx="2" fill="none" stroke="#FF7137" stroke-width="2"/>
    <path d="M32 10 V18 M42 10 V18 M28 22 H46" stroke="#FF7137" stroke-width="2"/>
    <text x="36" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263F48">19</text>
    <path d="M23 75 H49" stroke="#A8B6B9" stroke-width="2"/>
    <text x="91" y="29" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#263F48">CREATIVE WORKSHOP</text>
    <text x="91" y="53" font-family="Arial,sans-serif" font-size="12" fill="#70838A">SAT · 4:30 PM</text>
    <circle cx="247" cy="46" r="30" fill="#F2E7DE"/>
    <path d="M226 56 Q247 16 268 56Z" fill="#FF8A3D"/>
    <circle cx="247" cy="39" r="8" fill="#FFFFFF"/>
    <path d="M236 58 Q247 47 258 58" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- event 3 -->
  <g transform="translate(373 344)">
    <rect width="289" height="92" rx="3" fill="#F8FAFA" stroke="#415A63" stroke-width="2"/>
    <rect x="0" y="0" width="72" height="92" fill="#FFFFFF"/>
    <rect x="28" y="14" width="18" height="19" rx="2" fill="none" stroke="#FF7137" stroke-width="2"/>
    <path d="M32 10 V18 M42 10 V18 M28 22 H46" stroke="#FF7137" stroke-width="2"/>
    <text x="36" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263F48">25</text>
    <path d="M23 75 H49" stroke="#A8B6B9" stroke-width="2"/>
    <text x="91" y="29" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#263F48">LIVE SPORTS</text>
    <text x="91" y="53" font-family="Arial,sans-serif" font-size="12" fill="#70838A">SUN · 7:00 PM</text>
    <circle cx="247" cy="46" r="30" fill="#DCEBED"/>
    <circle cx="247" cy="46" r="18" fill="#334E57"/>
    <path d="M247 28 V64 M229 46 H265 M234 33 L260 59 M260 33 L234 59" stroke="#F4F7F7" stroke-width="3"/>
  </g>

  <!-- bottom navigation -->
  <path d="M406 460 H629" stroke="#D8E1E3" stroke-width="2"/>
  <circle cx="472" cy="468" r="4" fill="#FF7137"/>
  <circle cx="517" cy="468" r="4" fill="#A9B7BA"/>
  <circle cx="562" cy="468" r="4" fill="#A9B7BA"/>
</g>

<!-- small decorative ticket -->
<g transform="translate(285 100)">
  <path d="M0 12 Q12 12 12 0 H105 Q105 12 117 12 V70 Q105 70 105 82 H12 Q12 70 0 70Z" fill="#FFFFFF" stroke="#FF7540" stroke-width="3"/>
  <circle cx="58" cy="40" r="17" fill="#FFE3D5"/>
  <path d="M58 27 V53 M45 40 H71" stroke="#FF7540" stroke-width="4" stroke-linecap="round"/>
</g>
</svg>