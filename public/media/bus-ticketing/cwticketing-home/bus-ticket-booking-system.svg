<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Redesigned city bus illustration</title>
  <desc id="desc">Original vector illustration redesigned from the supplied transport concept.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F9FC"/><stop offset="1" stop-color="#E7F0F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF5B2E"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A7180"/><stop offset="1" stop-color="#174A59"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".14"/>
    </filter>
  </defs>
  
<rect width="600" height="600" rx="36" fill="#F7FAFC"/>
<circle cx="490" cy="90" r="48" fill="#FFE0D0"/><circle cx="105" cy="112" r="35" fill="#DDEEEF"/>
