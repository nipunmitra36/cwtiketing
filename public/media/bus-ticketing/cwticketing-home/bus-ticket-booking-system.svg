<!-- road -->
<path d="M0 432 H600" stroke="#29444D" stroke-width="34"/><path d="M0 432 H600" stroke="#fff" stroke-width="4" stroke-dasharray="46 38"/>
<!-- bus -->
<g transform="translate(42 260)" filter="url(#shadow)">
