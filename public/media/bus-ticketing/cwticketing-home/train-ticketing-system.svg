<!-- bridge -->
<path d="M42 395 H558" stroke="#6D8A92" stroke-width="12"/>
<path d="M70 395 V510 M195 395 V510 M320 395 V510 M445 395 V510" stroke="#AFC2C7" stroke-width="12"/>
<path d="M40 510 Q132 410 220 510 M165 510 Q257 410 345 510 M290 510 Q382 410 470 510" fill="none" stroke="#D7E3E6" stroke-width="8"/>
