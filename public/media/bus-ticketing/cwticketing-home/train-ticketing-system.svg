<g transform="translate(78 205) rotate(4 230 80)" filter="url(#shadow)">
 <path d="M0 55 Q0 25 32 18 H430 Q474 22 500 67 L500 133 H0Z" fill="#fff" stroke="#243F49" stroke-width="7"/>
 <path d="M0 55 H500 V92 H0Z" fill="#FF7540"/>
