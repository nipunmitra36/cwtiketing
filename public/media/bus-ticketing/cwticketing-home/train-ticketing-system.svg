 <rect x="30" y="91" width="70" height="25" fill="#FF7540"/><rect x="115" y="91" width="70" height="25" fill="#FF7540"/><rect x="200" y="91" width="70" height="25" fill="#FF7540"/><rect x="285" y="91" width="70" height="25" fill="#FF7540"/>
</g>
